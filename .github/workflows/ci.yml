name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CODE_SIGN_IDENTITY: '-'
      DEVELOPMENT_TEAM: ''
      LIDPILOT_SKIP_HARDWARE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate project generator and configuration
        run: gem install --user-install xcodeproj --version 1.27.0 --no-document
      - name: Check generated project
        run: ruby scripts/generate-project.rb --check
      - name: Validate scripts and disposable release fixtures
        run: ./scripts/verify.sh
      - name: Run Swift package tests
        run: ./scripts/test.sh
      - name: Test profiling instrumentation with harmless fixtures
        run: swift test --disable-sandbox --scratch-path /private/tmp/lidpilot-profile-ci -Xswiftc -DLIDPILOT_PROFILE
      - name: Test profiling report analysis
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-performance-profile.py
      - name: Build Debug app without signing secrets
        run: ./scripts/build.sh Debug
      - name: Build optimized Release app without signing secrets
        run: ./scripts/build.sh Release
