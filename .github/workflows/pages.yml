name: Publish GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publication:
        description: Publish the committed RC website to GitHub Pages.
        required: true
        type: choice
        default: skip
        options:
          - skip
          - publish-rc

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && inputs.publication == 'publish-rc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with:
          persist-credentials: false

      - name: Validate committed site and signed RC metadata without rewriting it
        run: ruby scripts/validate_pages_site.rb

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages v5

      - name: Upload the website directory unchanged
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # actions/upload-pages-artifact v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages v4
